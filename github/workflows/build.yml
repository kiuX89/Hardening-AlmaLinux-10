
name: Build AlmaLinux Hardening

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Compile executable
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name AlmaLinux-Hardening \
            AlmaLinux-Hardening.py

      - name: Verify binary
        run: |
          file dist/AlmaLinux-Hardening
          chmod +x dist/AlmaLinux-Hardening

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: AlmaLinux-Hardening-linux-x86_64
          path: dist/AlmaLinux-Hardening
          retention-days: 30
