
name: Build AlmaLinux Hardening

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la release (ex: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Compile executable
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name AlmaLinux-Hardening \
            AlmaLinux-Hardening.py

      - name: Verify binary
        run: |
          file dist/AlmaLinux-Hardening
          chmod +x dist/AlmaLinux-Hardening

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: AlmaLinux-Hardening v${{ inputs.version }}
          files: dist/AlmaLinux-Hardening
          generate_release_notes: true
          fail_on_unmatched_files: true
