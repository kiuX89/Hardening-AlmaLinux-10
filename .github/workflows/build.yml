
name: Build AlmaLinux Hardening

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la release (ex: 1.0.0)'
        required: true
        default: '1.0.2'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --runtime-hook .github/workflows/runtime_hook.py \
            --name AlmaLinux-Hardening \
            AlmaLinux-Hardening.py

      - name: Verify binary
        run: |
          file dist/AlmaLinux-Hardening
          ls -lh dist/AlmaLinux-Hardening
          chmod +x dist/AlmaLinux-Hardening

      - name: Rename binary
        run: |
          mv dist/AlmaLinux-Hardening \
             dist/AlmaLinux-Hardening-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlmaLinux-Hardening-linux-${{ matrix.arch }}
          path: dist/AlmaLinux-Hardening-linux-${{ matrix.arch }}
          retention-days: 30


  package:
    name: Package Linux binaries
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: package

      - name: Prepare archive
        run: |
          mkdir -p release/AlmaLinux-Hardening-v${{ inputs.version }}

          cp package/AlmaLinux-Hardening-linux-x86_64/* \
            release/AlmaLinux-Hardening-v${{ inputs.version }}/

          cp package/AlmaLinux-Hardening-linux-arm64/* \
            release/AlmaLinux-Hardening-v${{ inputs.version }}/

          chmod +x release/AlmaLinux-Hardening-v${{ inputs.version }}/*

      - name: Create tar.gz
        run: |
          cd release
          tar -czvf AlmaLinux-Hardening-v${{ inputs.version }}-linux.tar.gz \
            AlmaLinux-Hardening-v${{ inputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AlmaLinux-Hardening-linux-package
          path: release/*.tar.gz

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: release/*.tar.gz


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: AlmaLinux-Hardening v${{ inputs.version }}
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
